<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRep Governance Dashboard</title>
    <style>
        :root {
            --primary: #0033AD;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --border: #e0e0e0;
            --pending: #d9534f; 
            --voted: #5cb85c;   
            --link: #0055ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            line-height: 1.6;
        }

        .container { max-width: 850px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2rem; }

        .card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 1.5rem;
        }

        .input-group { display: flex; gap: 1rem; margin-top: 1rem; }
        @media (max-width: 768px) { .input-group { flex-direction: column; } }

        input {
            flex: 1; padding: 0.75rem; border: 1px solid var(--border);
            border-radius: 4px; font-size: 1rem; font-family: monospace;
        }

        button.primary-btn {
            background-color: var(--primary); color: white; border: none;
            padding: 0.75rem 1.5rem; border-radius: 4px; font-size: 1rem;
            cursor: pointer; transition: background-color 0.2s; white-space: nowrap;
        }
        button.primary-btn:hover { background-color: #002277; }
        button.primary-btn:disabled { background-color: #999; cursor: not-allowed; }

        /* Secondary Button for Sorting */
        button.sort-btn {
            background-color: #f0f0f0; color: var(--text-main); border: 1px solid var(--border);
            padding: 0.5rem 1rem; border-radius: 4px; font-size: 0.9rem; font-weight: bold;
            cursor: pointer; transition: background 0.2s;
        }
        button.sort-btn:hover { background-color: #e4e4e4; }

        /* Tabs UI */
        .tabs {
            display: flex; border-bottom: 2px solid var(--border);
            margin-bottom: 1rem; flex-wrap: wrap;
        }

        .tab {
            flex: 1; text-align: center; padding: 1rem 0.5rem; cursor: pointer;
            font-size: 1rem; font-weight: bold; color: var(--text-muted);
            background: transparent; border: none; outline: none; transition: color 0.2s;
        }
        .tab:hover { color: var(--text-main); }
        .tab.active {
            color: var(--primary); border-bottom: 3px solid var(--primary); margin-bottom: -2px;
        }

        .controls-bar {
            display: flex; justify-content: flex-end; margin-bottom: 1.5rem;
        }

        .view { display: none; }
        .view.active { display: block; }

        /* Proposal Item Styles */
        .proposal-item {
            border: 1px solid var(--border); border-radius: 6px;
            padding: 1.25rem; margin-bottom: 1.25rem; background: #fafafa;
        }
        .proposal-item:last-child { margin-bottom: 0; }

        .proposal-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .proposal-item h3 { margin: 0.75rem 0; font-size: 1.15rem; line-height: 1.4; }

        .badge {
            display: inline-block; padding: 0.35rem 0.65rem; border-radius: 4px;
            font-size: 0.75rem; font-weight: bold; color: white; text-transform: uppercase;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }

        /* VIBRANT ACTION TYPE COLORS */
        .bg-parameter { background-color: #9333ea; }      /* Deep Purple */
        .bg-hardfork { background-color: #dc2626; }       /* Strong Red */
        .bg-treasury { background-color: #16a34a; }       /* Emerald Green */
        .bg-noconfidence { background-color: #ea580c; }   /* Burnt Orange */
        .bg-committee { background-color: #2563eb; }      /* Royal Blue */
        .bg-constitution { background-color: #0891b2; }   /* Cyan */
        .bg-info { background-color: #4b5563; }           /* Slate Gray */
        .bg-default { background-color: #333333; }        /* Dark */

        .meta-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
            background: #ffffff; padding: 1rem; border-radius: 4px;
            border: 1px solid #eee; margin-bottom: 1rem; font-size: 0.9rem;
        }

        .hash-text {
            font-family: monospace; font-size: 0.85rem; word-break: break-all;
            color: var(--text-muted); background: #eee; padding: 0.5rem; border-radius: 4px;
        }

        .action-link {
            display: inline-block; margin-top: 1rem; font-size: 0.9rem;
            color: var(--link); text-decoration: none; font-weight: bold;
        }
        .action-link:hover { text-decoration: underline; }

        #status { text-align: center; font-weight: bold; margin-bottom: 1rem; color: var(--primary); }
        .disclaimer { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.5rem; }
        .empty-state { text-align: center; color: var(--text-muted); padding: 2rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>DRep Organizer</h1>
        <p>Track active proposals, deadlines, and pending votes.</p>
    </header>

    <div class="card">
        <div class="input-group">
            <input type="password" id="apiTokenInput" placeholder="Koios API Token">
            <input type="text" id="drepIdInput" placeholder="Enter your DRep ID (drep1...)">
            <button id="fetchBtn" class="primary-btn" onclick="runDashboard()">Fetch Data</button>
        </div>
        <p class="disclaimer">*Requires a Free Tier API Token from Koios. Stored locally in your browser.</p>
    </div>

    <div id="status"></div>

    <!-- Toggle Tabs -->
    <div class="tabs">
        <button id="tab-pending" class="tab active" onclick="switchTab('pending')">Needs Vote (0)</button>
        <button id="tab-voted" class="tab" onclick="switchTab('voted')">Voted (0)</button>
        <button id="tab-missed" class="tab" onclick="switchTab('missed')">Expired (0)</button>
    </div>

    <!-- Sorting Control -->
    <div class="controls-bar">
        <button id="sortBtn" class="sort-btn" onclick="toggleSort()" style="display: none;">
            Deadline: Closest First ⬇️
        </button>
    </div>

    <!-- Tab Content: Pending -->
    <div id="view-pending" class="view active card">
        <div id="pendingList"><div class="empty-state">Enter info above and fetch.</div></div>
    </div>

    <!-- Tab Content: Voted -->
    <div id="view-voted" class="view card">
        <div id="votedList"><div class="empty-state">Enter info above and fetch.</div></div>
    </div>

    <!-- Tab Content: Missed -->
    <div id="view-missed" class="view card">
        <div id="missedList"><div class="empty-state">Enter info above and fetch.</div></div>
    </div>
</div>

<script>
    const KOIOS_API = "https://api.koios.rest/api/v1";
    const IPFS_GATEWAYS = [
        "https://ipfs.io/ipfs/",
        "https://dweb.link/ipfs/",
        "https://cloudflare-ipfs.com/ipfs/",
        "https://gateway.pinata.cloud/ipfs/"
    ];

    const typeMapping = {
        'parameter_change': { label: 'Parameter Change', class: 'bg-parameter' },
        'hard_fork_initiation': { label: 'Hard-Fork', class: 'bg-hardfork' },
        'treasury_withdrawals': { label: 'Treasury', class: 'bg-treasury' },
        'no_confidence': { label: 'No Confidence', class: 'bg-noconfidence' },
        'update_committee': { label: 'Update Committee', class: 'bg-committee' },
        'new_constitution': { label: 'New Constitution', class: 'bg-constitution' },
        'info_action': { label: 'Info Action', class: 'bg-info' }
    };

    // --- Global State for Sorting ---
    let globalPending = [];
    let globalVoted = [];
    let globalMissed = [];
    let sortClosestFirst = true; // Default: Closest deadlines at the top

    function switchTab(tabId) {
        ['pending', 'voted', 'missed'].forEach(id => {
            document.getElementById(`tab-${id}`).classList.remove('active');
            document.getElementById(`view-${id}`).classList.remove('active');
        });
        document.getElementById(`tab-${tabId}`).classList.add('active');
        document.getElementById(`view-${tabId}`).classList.add('active');
    }

    function toggleSort() {
        sortClosestFirst = !sortClosestFirst;
        const btn = document.getElementById("sortBtn");
        
        if (sortClosestFirst) {
            btn.innerHTML = "Deadline: Closest First ⬇️";
        } else {
            btn.innerHTML = "Deadline: Furthest First ⬆️";
        }
        
        applySortAndRender();
    }

    document.addEventListener("DOMContentLoaded", () => {
        const savedDRep = localStorage.getItem("savedDrepId");
        const savedToken = localStorage.getItem("savedKoiosToken");
        if (savedDRep) document.getElementById("drepIdInput").value = savedDRep;
        if (savedToken) document.getElementById("apiTokenInput").value = savedToken;
    });

    async function runDashboard() {
        const drepId = document.getElementById("drepIdInput").value.trim();
        const apiToken = document.getElementById("apiTokenInput").value.trim();
        const statusEl = document.getElementById("status");
        const btn = document.getElementById("fetchBtn");

        if (!apiToken || !drepId) { alert("Please enter both Token and DRep ID."); return; }

        localStorage.setItem("savedDrepId", drepId);
        localStorage.setItem("savedKoiosToken", apiToken);

        btn.disabled = true;
        statusEl.innerText = "Fetching chain data and resolving dates...";
        
        const headers = { "Authorization": `Bearer ${apiToken}`, "Accept": "application/json" };

        try {
            const [proposalsRes, votesRes, tipRes, paramsRes] = await Promise.all([
                fetch(`${KOIOS_API}/proposal_list`, { headers }), 
                fetch(`${KOIOS_API}/drep_votes?_drep_id=${drepId}`, { headers }),
                fetch(`${KOIOS_API}/tip`, { headers }),
                fetch(`${KOIOS_API}/epoch_params`, { headers })
            ]);

            if (!proposalsRes.ok) throw new Error("Failed to fetch proposals.");

            const allProposals = await proposalsRes.json();
            const drepVotes = await votesRes.json();
            const tipData = await tipRes.json();
            const paramsData = await paramsRes.json();

            const currentEpoch = tipData[0].epoch_no;
            const currentUnix = tipData[0].block_time;
            const govLifetime = paramsData[0].gov_action_lifetime;

            const votedSet = new Set(drepVotes.map(v => `${v.proposal_tx_hash}#${v.proposal_index}`));

            // Reset Global Arrays
            globalPending = [];
            globalVoted = [];
            globalMissed = [];

            allProposals.forEach(proposal => {
                const uniqueId = `${proposal.proposal_tx_hash}#${proposal.proposal_index}`;
                const isVoted = votedSet.has(uniqueId);
                
                // Epoch Math
                let proposalEpoch = proposal.epoch_no || proposal.active_epoch; 
                if (!proposalEpoch && proposal.block_time) {
                    const epochsDiff = Math.floor((currentUnix - proposal.block_time) / 432000); 
                    proposalEpoch = currentEpoch - epochsDiff;
                }

                let isExpiredByMath = false;
                proposal.epochsLeft = 999; // Fallback for sorting if math fails

                if (proposalEpoch && govLifetime) {
                    proposal.expireEpoch = proposalEpoch + govLifetime; 
                    proposal.epochsLeft = proposal.expireEpoch - currentEpoch; 
                    if (proposal.epochsLeft < 0) {
                        isExpiredByMath = true;
                    }
                }

                const isEnded = proposal.expired || proposal.ratified || proposal.enacted || proposal.dropped || isExpiredByMath;

                if (isVoted) {
                    globalVoted.push(proposal);
                } else if (isEnded) {
                    globalMissed.push(proposal);
                } else {
                    globalPending.push(proposal);
                }
            });

            document.getElementById("tab-pending").innerText = `Needs Vote (${globalPending.length})`;
            document.getElementById("tab-voted").innerText = `Voted (${globalVoted.length})`;
            document.getElementById("tab-missed").innerText = `Expired (${globalMissed.length})`;

            // Show Sort Button and Render Sorted Data
            document.getElementById("sortBtn").style.display = "inline-block";
            applySortAndRender();

            statusEl.innerText = `Data Synced Successfully!`;

        } catch (error) {
            console.error(error);
            statusEl.innerText = "Error fetching data. Check your Koios Token limits and console logs.";
        } finally {
            btn.disabled = false;
        }
    }

    function applySortAndRender() {
        // Sorting Logic based on 'epochsLeft'
        const sortFn = (a, b) => {
            if (sortClosestFirst) {
                return a.epochsLeft - b.epochsLeft; // Smallest number (closest) first
            } else {
                return b.epochsLeft - a.epochsLeft; // Largest number (furthest) first
            }
        };

        // Create sorted copies of the global arrays
        const sortedPending = [...globalPending].sort(sortFn);
        const sortedVoted = [...globalVoted].sort(sortFn);
        const sortedMissed = [...globalMissed].sort(sortFn);

        renderList("pendingList", sortedPending);
        renderList("votedList", sortedVoted);
        renderList("missedList", sortedMissed);
    }

    function renderList(elementId, items) {
        const container = document.getElementById(elementId);
        container.innerHTML = ""; 

        if (items.length === 0) {
            container.innerHTML = `<div class="empty-state">No items in this category.</div>`;
            return;
        }

        items.forEach(item => {
            const div = document.createElement("div");
            div.className = "proposal-item";
            
            const txHash = item.proposal_tx_hash;
            const index = item.proposal_index;
            const rawType = item.proposal_type || item.action_type;
            const mapped = typeMapping[rawType] || { label: rawType || "Action", class: 'bg-default' };
            const fallbackTitle = `${mapped.label} #${index}`;
            const titleId = `title-${txHash}-${index}`;
            const govToolLink = `https://gov.tools/governance_actions/${txHash}#${index}`;

            let submittedStr = "Unknown";
            if (item.block_time) {
                const d = new Date(item.block_time * 1000);
                submittedStr = `${d.toLocaleDateString()} at ${d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
            }

            let expireText = "Calculating...";
            if (item.expireEpoch) {
                if (item.epochsLeft < 0 || item.expired || item.ratified || item.enacted || item.dropped) {
                    let statusLabel = "Ended";
                    if (item.expired) statusLabel = "Expired";
                    if (item.ratified) statusLabel = "Ratified";
                    if (item.enacted) statusLabel = "Enacted";
                    if (item.dropped) statusLabel = "Dropped";
                    expireText = `<span style="color: var(--text-muted); font-weight: bold;">${statusLabel} (Epoch ${item.expireEpoch})</span>`;
                } else {
                    const estDaysLeft = item.epochsLeft * 5; 
                    expireText = `<span style="color: var(--primary); font-weight: bold;">Epoch ${item.expireEpoch}</span> (~${estDaysLeft} days left)`;
                }
            }

            div.innerHTML = `
                <div class="proposal-header">
                    <span class="badge ${mapped.class}">${mapped.label}</span>
                    <span style="font-size: 0.85rem; color: var(--text-muted);">Index: ${index}</span>
                </div>
                
                <h3 id="${titleId}">Fetching Metadata Title...</h3>
                
                <div class="meta-grid">
                    <div>
                        <span style="color: var(--text-muted); font-size: 0.8rem;">Submitted Date</span><br>
                        <strong>${submittedStr}</strong>
                    </div>
                    <div>
                        <span style="color: var(--text-muted); font-size: 0.8rem;">Deadline / Status</span><br>
                        ${expireText}
                    </div>
                </div>

                <div class="hash-text"><strong>Tx:</strong> ${txHash}</div>
                <a href="${govToolLink}" target="_blank" class="action-link">↗ View on GovTool</a>
            `;
            container.appendChild(div);

            const metaUrl = item.meta_url || item.proposal_meta_url || null;
            resolveMetadataTitle(metaUrl, titleId, fallbackTitle);
        });
    }

    async function fetchFromIpfs(ipfsHash) {
        for (const gateway of IPFS_GATEWAYS) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2500);
                const res = await fetch(`${gateway}${ipfsHash}`, { signal: controller.signal });
                clearTimeout(timeoutId);
                
                if (res.ok) return await res.json();
            } catch (e) {}
        }
        throw new Error("All public IPFS gateways failed.");
    }

    async function resolveMetadataTitle(url, elementId, fallbackTitle) {
        const titleEl = document.getElementById(elementId);
        if (!url) { titleEl.innerText = fallbackTitle; return; }

        try {
            let data;
            if (url.startsWith('http')) {
                const res = await fetch(url);
                if (res.ok) data = await res.json();
            } else {
                let ipfsHash = url.replace('ipfs://', '');
                if (ipfsHash.includes('/ipfs/')) ipfsHash = ipfsHash.split('/ipfs/')[1];
                data = await fetchFromIpfs(ipfsHash);
            }

            const foundTitle = data?.body?.title || data?.title || data?.givenName; 
            if (foundTitle) {
                titleEl.innerText = foundTitle;
                return;
            }
        } catch (e) {
            console.warn(`Could not load metadata for ${url}`);
        }
        titleEl.innerText = fallbackTitle; 
    }
</script>

</body>
</html>
